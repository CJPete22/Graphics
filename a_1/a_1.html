<html>
    <head> 
        <title> Sliders. Sliders Everywhere. </title>
    </head>
    <body>
        <canvas id="myCanvas" width="500" height="400"></canvas>
        <table>
            <tbody>
                <td>
                    <br> X Coordinate </br>
                    <input id="xslider" type="range" min="-200" max="200"/>
                    <br> Y Coordinate </br>
                    <input id="yslider" type="range" min="-200" max="200"/>
                    <br> Triangle Size </br>
                    <input id="sizeChange" type="range" min="10" max="400"/>
                </td>
                <td>
                    <br> Red </br>
                    <input id="slider1" type="range" min="0" max="255" />
                    <br> Green </br>
                    <input id="slider2" type="range" min="0" max="255" />
                    <br> Blue </br>
                    <input id="slider3" type="range" min="0" max="255" />
                </td>
            </tbody>
        </table>
        <script src="a_1.js" id="module"></script>
  </body>
</html>
